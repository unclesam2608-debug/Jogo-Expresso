<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CCO Rio — Gestão de Frota Municipal</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1017;--panel:#131b26;--panel2:#192433;--border:#263549;--text:#e6edf5;--muted:#93a4b8;--accent:#38bdf8;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px max(20px,calc((100vw - 1440px)/2));background:#0f1722ed;border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px}.badge{background:var(--accent);color:#061018;font-size:12px;font-weight:900;padding:5px 10px;border-radius:7px}.brand-title{font-weight:800}.muted{color:var(--muted);font-size:12px}.top-controls,.row,.tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.container{max-width:1440px;margin:auto;padding:20px}.button,button,select{color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 12px}.button:hover,button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#051018;border-color:var(--accent);font-weight:800}button.success{background:var(--green);color:#05180c;border-color:var(--green);font-weight:800}button:disabled{opacity:.5;cursor:not-allowed}.setup,.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:end;margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field select{width:100%}.preview{background:#172232;border-left:3px solid var(--accent);padding:11px 13px;border-radius:7px;margin:12px 0;color:var(--muted);font-size:13px}.tabs{border-bottom:1px solid var(--border);padding:0 0 10px;margin:18px 0}.tab{font-weight:700}.tab.active{background:var(--accent);color:#051018;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}.card h2,.card h3{margin:0 0 10px;font-size:16px}.kpi-label{color:var(--muted);font-size:12px}.kpi{font-size:23px;font-weight:850;margin-top:3px}.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-block;padding:2px 8px;border:1px solid var(--border);border-radius:99px;background:var(--panel2);font-size:11px;font-weight:750}.good{color:#4ade80}.mid{color:#facc15}.bad{color:#f87171}.bus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}.bus-card{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:13px;display:grid;gap:9px}.bus-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.prefix{font-weight:900;font-size:17px;color:var(--accent)}.bar-label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.bar{height:7px;background:#0c121a;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .2s}.fill.warn{background:var(--yellow)}.fill.bad{background:var(--red)}.bus-actions{display:flex;gap:6px;flex-wrap:wrap}.bus-actions select,.bus-actions button{padding:6px 8px;font-size:12px}.history{max-height:230px;overflow:auto;background:#0d141d;border:1px solid #1e2b3c;border-radius:8px;padding:8px}.history-item{padding:6px 2px;border-bottom:1px solid #182230;color:var(--muted);font-size:12px}.history-item:last-child{border:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-size:12px}.empty{padding:24px;color:var(--muted);text-align:center}.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}.notice{font-size:12px;color:var(--muted)}@media(max-width:600px){header{position:static;padding:13px 15px}.container{padding:14px}.top-controls{width:100%}.top-controls button{flex:1}.grid-2{grid-template-columns:1fr}}
  </style>

<body>
<header>
  <div class="brand"><span class="badge">SPPO • RIO</span><div><div class="brand-title">CCO Rio — Gestão de Frota Municipal</div><div class="muted" id="clock">Selecione uma empresa para começar</div></div></div>
  <div class="top-controls"><button class="success" onclick="advance(1)">Avançar 1 dia</button><button class="primary" onclick="advance(7)">Avançar 7 dias</button><button onclick="resetGame()">Reiniciar operação</button></div>
</header>
<main class="container">
  <section class="setup">
    <div class="field"><label for="era">Corte cronológico</label><select id="era" onchange="populateCompanies()"><option value="2012">2012 — Alta demanda</option><option value="2019">2019 — Crise e BRT</option><option value="2024">2024 — Subsídio por KM e retomada</option></select></div>
    <div class="field"><label for="consortium">Consórcio</label><select id="consortium" onchange="populateCompanies()"><option value="ALL">Todos</option><option>Internorte</option><option>Intersul</option><option>Santa Cruz</option><option>Transcarioca</option></select></div>
    <div class="field"><label for="company">Empresa municipal</label><select id="company" onchange="previewCompany()"></select></div>
    <button class="primary" onclick="startCompany()">Assumir operação</button>
  </section>
  <div class="preview" id="preview"></div>
  <nav class="tabs" aria-label="Seções do jogo"><button class="tab active" data-tab="empresa" onclick="switchTab('empresa')">Sua empresa</button><button class="tab" data-tab="frota" onclick="switchTab('frota')">Frota & SMTR</button><button class="tab" data-tab="equipe" onclick="switchTab('equipe')">Equipe & escala</button><button class="tab" data-tab="loja" onclick="switchTab('loja')">Encarroçadora</button><button class="tab" data-tab="financeiro" onclick="switchTab('financeiro')">Financeiro & histórico</button></nav>
  <section id="content"></section>
</main>
<script>
'use strict';
const PREFIX={Internorte:'B',Intersul:'A',Transcarioca:'C','Santa Cruz':'D'};
const COMPANIES=[
 {code:'10000',name:'Transportes Paranapuan',group:'Independente',cons:['Internorte'],eras:{2012:'Boa',2019:'Péssima',2024:'Ruim'}},
 {code:'10500',name:'Viação Penha Rio',group:'Grupo Campo Grande',cons:['Internorte'],eras:{2012:'Boa',2019:'Péssima',2024:'Muito Péssima'}},
 {code:'11500',name:'Viação Vila Real',group:'Grupo Guanabara',cons:['Internorte','Santa Cruz'],eras:{2012:'Boa',2019:'Boa',2024:'Boa'}},
 {code:'12000',name:'Expresso Recreio',groupEra:{2012:'Grupo Pégaso',2019:'Grupo Guanabara',2024:'Grupo Guanabara'},cons:['Santa Cruz','Transcarioca'],eras:{2012:'Boa',2019:'Boa',2024:'Mediana'}},
 {code:'12500',name:'Viação Normandy',group:'Grupo Guanabara',cons:['Transcarioca'],eras:{2012:'Excelente',2019:'Boa',2024:'Mediana'}},
 {code:'13000',name:'Transportes Barra',group:'Grupo Redentor',cons:['Transcarioca','Santa Cruz'],eras:{2012:'Excelente',2019:'Mediana',2024:'Ruim'}},
 {code:'17000',name:'Auto Viação Palmares',group:'Grupo Pégaso',cons:['Santa Cruz'],eras:{2012:'Mediana',2019:'Ruim',2024:'Ruim'}},
 {code:'25500',name:'Rodoviária Âncora Matias',group:'Grupo Guanabara',cons:['Internorte'],eras:{2012:'Excelente',2019:'Boa',2024:'Excelente'}},
 {code:'27500',name:'Transportes Vila Isabel',groupEra:{2012:'Independente',2019:'Independente',2024:'Grupo Real'},cons:['Intersul'],eras:{2012:'Ruim',2019:'Péssima',2024:'Péssima'}},
 {code:'28500',name:'Viação Ideal',group:'Grupo Guanabara',cons:['Internorte'],eras:{2012:'Excelente',2019:'Mediana',2024:'Excelente'}},
 {code:'30000',name:'Transportes Futuro',group:'Grupo Redentor',cons:['Transcarioca'],eras:{2012:'Excelente',2019:'Boa',2024:'Mediana'}},
 {code:'31000_VG',print:'31000',name:'Viação VG',group:'Independente',cons:['Internorte'],eras:{2019:'Mediana',2024:'Mediana'}},
 {code:'32500',name:'Viação Pavunense',group:'Grupo Pavunense',cons:['Internorte'],eras:{2012:'Excelente',2019:'Mediana',2024:'Mediana'}},
 {code:'33100',name:'Sancetur — SOU Rio de Janeiro',group:'Grupo SOU',cons:['Santa Cruz'],eras:{2024:'Excelente'}},
 {code:'39500',name:'Transportes Santa Maria',group:'Independente',cons:['Transcarioca'],eras:{2012:'Boa'}},
 {code:'41000',name:'Real Auto Ônibus',group:'Grupo Real',cons:['Transcarioca','Intersul'],eras:{2012:'Excelente',2019:'Mediana',2024:'Péssima'}},
 {code:'42500',name:'Viação Acari',group:'Grupo Rubanil',cons:['Internorte','Transcarioca'],eras:{2012:'Excelente',2019:'Boa'}},
 {code:'47000',name:'Viação Redentor',group:'Grupo Redentor',cons:['Transcarioca'],eras:{2012:'Excelente',2019:'Mediana',2024:'Ruim'}},
 {code:'48000',name:'Auto Viação Alpha',group:'Grupo Guanabara',cons:['Intersul'],eras:{2012:'Excelente',2019:'Excelente',2024:'Boa'}},
 {code:'51500',name:'Viação Novacap',group:'Independente',cons:['Internorte','Transcarioca'],eras:{2012:'Excelente',2019:'Excelente',2024:'Excelente'}},
 {code:'55000',name:'Transportes Estrela Azul',group:'Estrela Azul',cons:['Intersul','Internorte'],eras:{2012:'Mediana',2019:'Muito Péssima'}},
 {code:'63000',name:'Gire Transportes',group:'Grupo Fábios',cons:['Internorte','Intersul'],eras:{2012:'Mediana',2019:'Mediana',2024:'Mediana'}},
 {code:'71000',name:'Viação Verdun',group:'Grupo Guanabara',cons:['Internorte'],eras:{2012:'Excelente',2019:'Boa',2024:'Boa'}},
 {code:'72000',name:'Transurb',group:'Grupo Guanabara',cons:['Transcarioca','Intersul'],eras:{2012:'Boa',2019:'Boa',2024:'Boa'}},
 {code:'86000',name:'Auto Viação Jabour',group:'Grupo Guanabara',cons:['Santa Cruz'],eras:{2012:'Boa',2019:'Mediana',2024:'Boa'}},
 {code:'87000',name:'Expresso Pégaso',group:'Grupo Pégaso',cons:['Santa Cruz'],eras:{2012:'Mediana',2019:'Péssima',2024:'Muito Péssima'}}
];
const LINES=[{code:'300',name:'Deodoro x Candelária',cons:'Santa Cruz',km:38,pax:420},{code:'397',name:'Campo Grande x Candelária',cons:'Santa Cruz',km:54,pax:510},{code:'474',name:'Jacaré x Copacabana',cons:'Intersul',km:24,pax:360},{code:'584',name:'Leblon x Cosme Velho',cons:'Intersul',km:14,pax:260},{code:'639',name:'Jardim América x Saens Peña',cons:'Internorte',km:22,pax:340},{code:'774',name:'Madureira x Jardim Oceânico',cons:'Transcarioca',km:26,pax:390},{code:'864',name:'Bangu x Barra da Tijuca',cons:'Transcarioca',km:31,pax:410}];
const CHASSIS=[{id:'mb_of1721',name:'Mercedes-Benz OF-1721',price:420000,fuel:1},{id:'mb_o500u',name:'Mercedes-Benz O-500U',price:480000,fuel:1.05},{id:'vw_17230',name:'Volkswagen 17.230 OD',price:405000,fuel:1.01},{id:'vw_9160',name:'Volkswagen 9.160 OD',price:350000,fuel:.9},{id:'scania_k250',name:'Scania K250',price:550000,fuel:.95},{id:'agrale_ma17',name:'Agrale MA 17.0',price:380000,fuel:1.02},{id:'eletrico_sppo',name:'Chassi Elétrico SPPO',price:680000,fuel:.45,min:2024}];
const BODIES=[{name:'Marcopolo Torino',maker:'Marcopolo',price:440000,cap:45},{name:'CAIO Apache Vip',maker:'CAIO',price:520000,cap:45},{name:'Comil Svelto',maker:'Comil',price:410000,cap:44},{name:'Mascarello GranVia',maker:'Mascarello',price:400000,cap:44},{name:'Marcopolo Senior',maker:'Marcopolo',price:365000,cap:30}];
const ACS=[{id:'none',name:'Sem ar-condicionado',price:0},{id:'denso',name:'Denso',price:120000},{id:'valeo',name:'Valeo',price:160000}];
const SERVICES=[{id:'corretiva',name:'Corretiva',days:1,cost:4500},{id:'basica',name:'Revisão básica',days:2,cost:8500},{id:'geral',name:'Revisão geral',days:4,cost:17000},{id:'motor',name:'Revisão de motor',days:6,cost:32000},{id:'reforma',name:'Reforma geral',days:10,cost:68000}];
const EURO={EURO_III:{name:'Euro III',fuel:1.16,maint:1.18},EURO_V:{name:'Euro V',fuel:1,maint:1},EURO_VI:{name:'Euro VI',fuel:.9,maint:1.1}};
let state={era:2012,year:2012,day:1,tab:'empresa',company:null,cash:0,revenue:0,expenses:0,buses:[],staff:{motorista:0,mecanico:2,eletricista:1,lanterneiro:1,borracheiro:1,pintor:1},ledger:[]};
const groupOf=(c,e)=>c.groupEra?.[e]||c.group||'Independente';
const money=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
function populateCompanies(){const era=+document.querySelector('#era').value,cons=document.querySelector('#consortium').value,sel=document.querySelector('#company');sel.innerHTML='';COMPANIES.filter(c=>c.eras[era]&&(cons==='ALL'||c.cons.includes(cons))).forEach(c=>{const o=document.createElement('option');o.value=c.code;o.textContent=`[${c.print||c.code}] ${c.name} — ${groupOf(c,era)} (${c.eras[era]})`;sel.append(o)});previewCompany()}
function previewCompany(){const era=+document.querySelector('#era').value,c=COMPANIES.find(x=>x.code===document.querySelector('#company').value);if(!c){document.querySelector('#preview').textContent='Nenhuma empresa disponível para este filtro.';return}const note=era===2012?'Alta demanda e necessidade de expansão da frota.':era===2019?'Crise de passageiros, BRT e custos operacionais elevados.':'Retomada, subsídio por quilômetro e gratuidades.';document.querySelector('#preview').innerHTML=`<strong>${c.name}</strong> · ${groupOf(c,era)} · Consórcio(s): ${c.cons.join(', ')} · Situação: <strong>${c.eras[era]}</strong>. ${note}`}
function addLog(text){state.ledger.unshift({time:`${state.year} • D${state.day}`,text});state.ledger=state.ledger.slice(0,60)}
function makeBus(i,c,era,condition){const cons=c.cons[i%c.cons.length],letter=PREFIX[cons],base=+(c.print||c.code).replace(/\D/g,'');let chassis=CHASSIS.find(x=>x.id.startsWith('mb_'))||CHASSIS[0];if(groupOf(c,era)!=='Grupo Guanabara'){const options=CHASSIS.filter(x=>!x.min||era>=x.min);chassis=options[i%options.length]}const body=BODIES[i%BODIES.length],line=LINES[i%LINES.length],used=condition==='USADO';return{id:`${Date.now()}_${i}`,prefix:`${letter}${base+i+1}`,consortium:cons,condition,yearBus:used?era-6:condition==='SEMINOVO'?era-2:era,km:used?520000+i*90000:condition==='SEMINOVO'?180000:0,euro:used?'EURO_III':era>=2024?'EURO_VI':'EURO_V',chassis,body,ac:ACS[i%ACS.length],status:'OPERANDO',maintenanceDays:0,service:'',line:line.code,health:{engine:used?Math.max(35,76-i*7):condition==='SEMINOVO'?82:96,body:used?Math.max(35,72-i*6):condition==='SEMINOVO'?84:96,tires:used?Math.max(30,70-i*8):condition==='SEMINOVO'?80:96},smtr:{fines:i%3===0?1:0,expired:used&&i%2===1,inspection:!used||i%2===0,sealed:false},history:[`Ano ${era} • D1: alocado à linha ${line.code}`]}}
function startCompany(){const era=+document.querySelector('#era').value,c=COMPANIES.find(x=>x.code===document.querySelector('#company').value);if(!c)return;const score={Excelente:92,Boa:76,Mediana:56,Ruim:38,Péssima:22,'Muito Péssima':10}[c.eras[era]]||55;state.era=era;state.year=era;state.day=1;state.company=c;state.cash=Math.round(1800000+score*45000);state.buses=[makeBus(0,c,era,'ZERO_KM'),makeBus(1,c,era,'ZERO_KM'),makeBus(2,c,era,'SEMINOVO'),makeBus(3,c,era,'USADO'),makeBus(4,c,era,'USADO')];state.staff={motorista:10,mecanico:2,eletricista:1,lanterneiro:1,borracheiro:1,pintor:1};state.ledger=[];addLog(`Operação iniciada em ${era}: ${c.name}.`);render()}
function resetGame(){if(state.company&&!confirm('Reiniciar a operação e perder o progresso atual?'))return;startCompany()}
function switchTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function demand(year){return year<=2014?1.25:year<=2019?.82:year===2020?.45:year<=2023?.78:1.02}
function multiplier(bus,maintenance=false){const euro=EURO[bus.euro]||EURO.EURO_V;return(1+bus.km/100000*(maintenance?.08:.045))*(maintenance?euro.maint:euro.fuel)*(bus.condition==='USADO'?1.25:bus.condition==='SEMINOVO'?1.07:.96)*(maintenance?1:(bus.chassis.fuel||1))}
function advance(days){if(!state.company)return alert('Selecione uma empresa primeiro.');let rev=0,exp=0;for(let i=0;i<days;i++){state.day++;if(state.day>30){state.day=1;state.year++}let dr=0,de=state.staff.motorista*145+Object.entries(state.staff).filter(([r])=>r!=='motorista').reduce((s,[,n])=>s+n*140,0);const active=state.buses.filter(b=>b.status==='OPERANDO'&&!b.smtr.sealed&&!b.smtr.expired);de+=Math.max(0,active.length*2-state.staff.motorista)*260;for(const bus of state.buses){if(bus.status==='OFICINA'){if(--bus.maintenanceDays<=0){bus.status='OPERANDO';bus.maintenanceDays=0;addLog(`${bus.prefix} concluiu a manutenção.`)}continue}if(bus.status!=='OPERANDO'||bus.smtr.sealed||bus.smtr.expired)continue;const line=LINES.find(l=>l.code===bus.line)||LINES[0],km=line.km*5;bus.km+=km;const pax=line.pax*demand(state.year)*(bus.ac.id==='none'?.92:1.12),fare=state.year<=2015?2.75:state.year<=2021?4.05:4.3,subsidy=state.year>=2024?3.45:0;dr+=pax*(state.year>=2024?.72:state.year<=2014?.9:.8)*fare+km*subsidy;de+=km*2.1*multiplier(bus)+km*1.45*multiplier(bus,true);bus.health.engine=Math.max(0,bus.health.engine-.65*multiplier(bus,true));bus.health.body=Math.max(0,bus.health.body-.45*multiplier(bus,true));bus.health.tires=Math.max(0,bus.health.tires-.85*multiplier(bus,true));if(Math.random()<.03&&!bus.smtr.inspection){bus.smtr.fines++;de+=3500;addLog(`SMTR autuou ${bus.prefix}.`);if(bus.smtr.fines>=4){bus.smtr.sealed=true;bus.status='PARADO'}}if(bus.health.engine<=5||bus.health.tires<=5){bus.status='PARADO';addLog(`${bus.prefix} quebrou e está parado.`)}bus.history.unshift(`${state.year} • D${state.day}: ${line.code}, ${km} km`);bus.history=bus.history.slice(0,12)}state.cash+=Math.round(dr-de);rev+=dr;exp+=de}state.revenue=Math.round(rev);state.expenses=Math.round(exp);addLog(`Ciclo de ${days} dia(s): receita ${money(rev)}; despesas ${money(exp)}.`);render()}
function serviceBus(id,serviceId){const b=state.buses.find(x=>x.id===id),s=SERVICES.find(x=>x.id===serviceId);if(!b||!s)return;const cost=Math.round(s.cost*multiplier(b,true));if(state.cash<cost)return alert('Caixa insuficiente para este serviço.');state.cash-=cost;b.status='OFICINA';b.maintenanceDays=s.days;b.service=s.name;b.smtr.expired=false;b.smtr.sealed=false;b.smtr.inspection=true;if(s.id==='reforma'){b.health={engine:96,body:96,tires:96};b.smtr.fines=0}else{b.health.engine=Math.min(100,b.health.engine+(s.id==='motor'?48:s.id==='geral'?25:14));b.health.body=Math.min(100,b.health.body+(s.id==='geral'?18:0));b.health.tires=Math.min(100,b.health.tires+(s.id==='geral'?30:20))}addLog(`${b.prefix} enviado para ${s.name} por ${money(cost)}.`);render()}
function assignLine(id,code){const b=state.buses.find(x=>x.id===id);if(!b)return;b.line=code;addLog(`${b.prefix} designado à linha ${code}.`);render()}
function hire(role,delta){const next=state.staff[role]+delta;if(next<0)return;if(delta>0){const fee=role==='motorista'?2500:3200;if(state.cash<fee)return alert('Caixa insuficiente para contratação.');state.cash-=fee;addLog(`Contratado 1 ${role} por ${money(fee)}.`)}state.staff[role]=next;render()}
function buyBus(){const condition=document.querySelector('#condition').value,chassis=CHASSIS.find(x=>x.id===document.querySelector('#chassis').value),body=BODIES[+document.querySelector('#body').value],ac=ACS[+document.querySelector('#ac').value];if(!chassis||!body||!ac)return;const cost=condition==='ZERO_KM'?Math.max(900000,chassis.price+body.price+ac.price+58000):condition==='SEMINOVO'?580000:205000;if(state.cash<cost)return alert(`Saldo insuficiente. Valor: ${money(cost)}.`);const idx=state.buses.length,c=state.company,cons=c.cons[idx%c.cons.length],prefix=`${PREFIX[cons]}${+(c.print||c.code).replace(/\D/g,'')+idx+1}`,bus=makeBus(idx,c,state.year,condition);Object.assign(bus,{prefix,chassis,body,ac,euro:document.querySelector('#euro').value,condition,status:'OPERANDO',km:condition==='ZERO_KM'?0:condition==='SEMINOVO'?210000:640000});state.cash-=cost;state.buses.push(bus);state.staff.motorista+=2;addLog(`Novo veículo ${prefix} adquirido por ${money(cost)}.`);render()}
function bar(label,value){const cl=value<35?'bad':value<65?'warn':'';return `<div><div class="bar-label"><span>${label}</span><strong>${Math.round(value)}%</strong></div><div class="bar"><div class="fill ${cl}" style="width:${Math.max(0,Math.min(100,value))}%"></div></div></div>`}
function render(){if(!state.company)return;const c=state.company,group=groupOf(c,state.era);document.querySelector('#clock').textContent=`Ano ${state.year} • Dia ${state.day} • ${c.name} (${group})`;const content=document.querySelector('#content'),stopped=state.buses.filter(b=>b.status!=='OPERANDO'||b.smtr.sealed||b.smtr.expired).length,total=Object.values(state.staff).reduce((a,b)=>a+b,0);if(state.tab==='empresa'){content.innerHTML=`<div class="grid"><article class="card"><div class="kpi-label">Caixa</div><div class="kpi">${money(state.cash)}</div><div class="kpi-sub">Receita do último ciclo: ${money(state.revenue)}</div></article><article class="card"><div class="kpi-label">Frota / indisponíveis</div><div class="kpi">${state.buses.length} / ${stopped}</div><div class="kpi-sub">Prefixo base: ${c.print||c.code}</div></article><article class="card"><div class="kpi-label">Funcionários</div><div class="kpi">${total}</div><div class="kpi-sub">Motoristas: ${state.staff.motorista} · ideal: ${state.buses.length*2}</div></article><article class="card"><div class="kpi-label">Situação de referência</div><div class="kpi"><span class="pill ${['Excelente','Boa'].includes(c.eras[state.era])?'good':c.eras[state.era]==='Mediana'?'mid':'bad'}">${c.eras[state.era]}</span></div><div class="kpi-sub">Grupo: ${group}</div></article></div><article class="card"><h2>Panorama da operação</h2><p class="notice">A empresa opera no(s) consórcio(s) ${c.cons.join(', ')} no corte de ${state.era}. A demanda, as receitas e os custos variam conforme o período, a quilometragem e a condição da frota. Use as abas para manter os veículos, contratar equipe e acompanhar o caixa.</p></article>`}
else if(state.tab==='frota'){content.innerHTML=state.buses.length?`<div class="bus-grid">${state.buses.map(b=>`<article class="bus-card"><div class="bus-head"><div><span class="prefix">${b.prefix}</span> <span class="pill">${b.consortium}</span></div><span class="pill ${b.status==='OPERANDO'&&!b.smtr.expired?'good':'bad'}">${b.smtr.sealed?'LACRADO':b.smtr.expired?'DOCUMENTAÇÃO VENCIDA':b.status==='OFICINA'?`OFICINA · ${b.maintenanceDays}d`:b.status}</span></div><div class="notice"><strong>${b.body.name}</strong> · ${b.chassis.name}<br>${b.euro.replace('_',' ')} · ${b.ac.name} · Ano ${b.yearBus} · ${b.km.toLocaleString('pt-BR')} km</div>${bar('Motor',b.health.engine)}${bar('Carroceria',b.health.body)}${bar('Pneus',b.health.tires)}<div class="notice">Multas SMTR: ${b.smtr.fines} · Inspeção: ${b.smtr.inspection?'feita':'pendente'}</div><div class="bus-actions"><select aria-label="Linha de ${b.prefix}" onchange="assignLine('${b.id}',this.value)">${LINES.map(l=>`<option value="${l.code}" ${b.line===l.code?'selected':''}>${l.code} — ${l.name}</option>`).join('')}</select><select id="srv-${b.id}" aria-label="Serviço para ${b.prefix}">${SERVICES.map(s=>`<option value="${s.id}">${s.name} · ${s.days} dia(s)</option>`).join('')}</select><button onclick="serviceBus('${b.id}',document.querySelector('#srv-${b.id}').value)">Enviar à oficina</button></div><details><summary class="notice">Histórico recente</summary><div class="history">${b.history.map(x=>`<div class="history-item">${x}</div>`).join('')}</div></details></article>`).join('')}</div>`:'<div class="empty">Sua frota ainda não possui veículos.</div>'}
else if(state.tab==='equipe'){content.innerHTML=`<article class="card"><h2>Equipe & escala</h2><p class="notice">Escala recomendada: dois motoristas por ônibus. Déficits geram horas extras durante a operação.</p><div class="table-wrap"><table><thead><tr><th>Função</th><th>Quantidade</th><th>Gerenciar</th></tr></thead><tbody>${Object.entries(state.staff).map(([role,qty])=>`<tr><td>${role[0].toUpperCase()+role.slice(1)}</td><td>${qty}</td><td><button onclick="hire('${role}',-1)">−1</button> <button class="primary" onclick="hire('${role}',1)">+1</button></td></tr>`).join('')}</tbody></table></div><p class="notice">Motoristas: ${state.staff.motorista} / ${state.buses.length*2} recomendados · Contratação: R$ 2.500 motorista; R$ 3.200 demais funções.</p></article>`}
else if(state.tab==='loja'){const allowedChassis=CHASSIS.filter(x=>!x.min||state.era>=x.min);content.innerHTML=`<article class="card"><h2>Encarroçadora e aquisição</h2><p class="notice">Escolha a configuração e a condição do veículo. Veículos usados podem exigir inspeção antes de operar.</p><div class="shop-grid"><div class="field"><label>Condição</label><select id="condition"><option value="ZERO_KM">Zero km (a partir de R$ 900 mil)</option><option value="SEMINOVO">Seminovo (R$ 580 mil)</option><option value="USADO">Usado (R$ 205 mil)</option></select></div><div class="field"><label>Chassi</label><select id="chassis">${allowedChassis.map(x=>`<option value="${x.id}">${x.name} — ${money(x.price)}</option>`).join('')}</select></div><div class="field"><label>Carroceria</label><select id="body">${BODIES.map((x,i)=>`<option value="${i}">${x.name} — ${money(x.price)}</option>`).join('')}</select></div><div class="field"><label>Ar-condicionado</label><select id="ac">${ACS.map((x,i)=>`<option value="${i}">${x.name} — ${money(x.price)}</option>`).join('')}</select></div><div class="field"><label>Padrão de emissões</label><select id="euro">${Object.entries(EURO).map(([id,x])=>`<option value="${id}" ${state.era>=2024&&id==='EURO_VI'?'selected':''}>${x.name}</option>`).join('')}</select></div><button class="success" onclick="buyBus()">Comprar veículo</button></div></article>`}
else{content.innerHTML=`<div class="grid"><article class="card"><div class="kpi-label">Saldo atual</div><div class="kpi">${money(state.cash)}</div></article><article class="card"><div class="kpi-label">Receita do último ciclo</div><div class="kpi">${money(state.revenue)}</div></article><article class="card"><div class="kpi-label">Despesas do último ciclo</div><div class="kpi">${money(state.expenses)}</div></article></div><article class="card"><h2>Livro-caixa e ocorrências</h2><div class="history">${state.ledger.length?state.ledger.map(x=>`<div class="history-item"><strong>[${x.time}]</strong> ${x.text}</div>`).join(''):'<div class="empty">Nenhuma movimentação registrada.</div>'}</div></article>`}}
populateCompanies();startCompany();
</script>
</body>
</html>
